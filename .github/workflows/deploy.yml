name: Build and Deploy FTP Server

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finale-ftp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/finale-ftp:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Trigger Dokploy Deployment
        run: |
          curl -X 'POST' \
          '${{ secrets.DOKPLOY_URL }}/api/trpc/application.deploy' \
          -H 'accept: application/json' \
          -H 'Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}' \
          -H 'Content-Type: application/json' \
          -d '{
              "json":{
                  "applicationId": "${{ secrets.DOKPLOY_APP_ID }}"
              }
          }'
